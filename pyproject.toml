[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanintel"
version = "0.1.0"
description = "Satellite-based urban growth and economic activity intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.380"]
dashboard = ["streamlit>=1.49", "streamlit-folium>=0.18", "folium>=0.15", "plotly>=5.18"]

[project.scripts]
urbanintel = "urbanintel.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
