<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" style="color:#1a211c;--ground:#ffffff;--surface:#ffffff;--accent:#10695a;--accent-soft:#e3efe9;--muted:#6b7870" role="img" aria-label="System architecture in three tiers: a shared Prithvi-EO-2.0 encoder with growth and change heads on Landsat and Sentinel-2; XGBoost on drivers plus image embeddings, a stacker, the cellular automaton and the ghost typology; and a tool-grounded LLM assistant that writes zone briefs for the dashboard.">
  <defs>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <rect width="960" height="620" style="fill:var(--ground)"></rect>

  <!-- tier bands -->
  <rect x="20" y="40" width="920" height="225" rx="4" fill="currentColor" opacity="0.035"></rect>
  <rect x="20" y="278" width="920" height="192" rx="4" fill="currentColor" opacity="0.035"></rect>
  <rect x="20" y="492" width="920" height="110" rx="4" fill="currentColor" opacity="0.035"></rect>
  <text x="30" y="56" font-size="10.5" letter-spacing="1" style="fill:var(--muted)">1 · PERCEPTION</text>
  <text x="30" y="294" font-size="10.5" letter-spacing="1" style="fill:var(--muted)">2 · REASONING</text>
  <text x="30" y="506" font-size="10.5" letter-spacing="1" style="fill:var(--muted)">3 · EXPLANATION</text>

  <!-- tier 1 -->
  <rect x="30" y="80" width="170" height="45" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="115" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Landsat 5 / 8 · HLS L30</text>
  <text x="115" y="115" text-anchor="middle" fill="currentColor">30 m · 2000 – 2025</text>
  <rect x="30" y="145" width="170" height="45" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="115" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Sentinel-2 as HLS S30</text>
  <text x="115" y="180" text-anchor="middle" fill="currentColor">30 m · 2018, 2024</text>

  <rect x="260" y="80" width="200" height="110" rx="3" stroke-width="1.5" style="fill:var(--accent-soft);stroke:var(--accent)"></rect>
  <text x="360" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Prithvi-EO-2.0-300M-TL</text>
  <text x="360" y="122" text-anchor="middle" fill="currentColor">temporal ViT encoder</text>
  <text x="360" y="138" text-anchor="middle" fill="currentColor">3D patch embedding 16 × 16 × T</text>
  <text x="360" y="154" text-anchor="middle" fill="currentColor">masked-autoencoder pretrained</text>
  <text x="360" y="170" text-anchor="middle" fill="currentColor">one encoder, shared by every head</text>

  <rect x="520" y="80" width="190" height="45" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="615" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Change head</text>
  <text x="615" y="115" text-anchor="middle" fill="currentColor">2018 → 2024 built-up change map</text>
  <rect x="520" y="145" width="190" height="45" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="615" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Growth head</text>
  <text x="615" y="180" text-anchor="middle" fill="currentColor">s_img = P(urban by t + 5)</text>

  <line x1="200" y1="102" x2="258" y2="102" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <line x1="200" y1="167" x2="258" y2="167" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <line x1="460" y1="102" x2="518" y2="102" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <line x1="460" y1="167" x2="518" y2="167" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>

  <line x1="360" y1="190" x2="360" y2="304" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <text x="368" y="238" style="fill:var(--muted)">token embeddings</text>
  <text x="368" y="252" style="fill:var(--muted)">PCA → 16 components</text>

  <line x1="615" y1="190" x2="615" y2="304" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <text x="623" y="238" style="fill:var(--muted)">s_img</text>

  <polyline points="710,102 835,102 835,390" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></polyline>
  <text x="843" y="238" style="fill:var(--muted)">visible change</text>
  <text x="843" y="252" style="fill:var(--muted)">inside each zone</text>

  <!-- tier 2 -->
  <rect x="30" y="306" width="170" height="60" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="115" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Driver rasters, 100 m</text>
  <text x="115" y="341" text-anchor="middle" fill="currentColor">roads · population · distance</text>
  <text x="115" y="356" text-anchor="middle" fill="currentColor">slope · built-up fraction</text>

  <rect x="260" y="306" width="200" height="60" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="360" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">XGBoost</text>
  <text x="360" y="341" text-anchor="middle" fill="currentColor">8 drivers + 16 image components</text>
  <text x="360" y="356" text-anchor="middle" fill="currentColor">→ s_tab · TreeSHAP</text>

  <rect x="520" y="306" width="190" height="60" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="615" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Stacker (logistic)</text>
  <text x="615" y="341" text-anchor="middle" fill="currentColor">s = blend(s_img, s_tab)</text>
  <text x="615" y="356" text-anchor="middle" fill="currentColor">fitted on validation blocks only</text>

  <line x1="200" y1="336" x2="258" y2="336" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <line x1="460" y1="336" x2="518" y2="336" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <line x1="615" y1="366" x2="615" y2="390" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>

  <rect x="520" y="392" width="190" height="70" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="615" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Cellular automaton</text>
  <text x="615" y="427" text-anchor="middle" fill="currentColor">0.65 s + 0.35 n₃₀₀ · 8 rounds</text>
  <text x="615" y="442" text-anchor="middle" fill="currentColor">demand from CAGR</text>
  <text x="615" y="457" text-anchor="middle" fill="currentColor">20 seeds → P(conversion)</text>

  <rect x="740" y="392" width="190" height="70" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="835" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Ghost typology</text>
  <text x="835" y="427" text-anchor="middle" fill="currentColor">activity rule + PU classifier</text>
  <text x="835" y="442" text-anchor="middle" fill="currentColor">150 – 300 hand labels</text>
  <text x="835" y="457" text-anchor="middle" fill="currentColor">→ calibrated P(ghost)</text>

  <!-- bus into outputs -->
  <line x1="615" y1="462" x2="615" y2="481" stroke="currentColor" stroke-width="1.2"></line>
  <polyline points="835,462 835,481 245,481 245,514" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></polyline>

  <!-- tier 3 -->
  <rect x="30" y="516" width="430" height="70" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="245" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Outputs</text>
  <text x="245" y="553" text-anchor="middle" fill="currentColor">results JSON · rasters · zone cards · change map</text>
  <text x="245" y="569" text-anchor="middle" fill="currentColor">P(conversion) 2025 / 2030 · P(ghost) per zone</text>

  <rect x="520" y="516" width="190" height="70" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="615" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">LLM assistant</text>
  <text x="615" y="550" text-anchor="middle" fill="currentColor">Claude API, tool calls only</text>
  <text x="615" y="564" text-anchor="middle" fill="currentColor">read_zone · read_metric</text>
  <text x="615" y="578" text-anchor="middle" fill="currentColor">zone briefs · ask-the-map Q&amp;A</text>

  <rect x="740" y="516" width="190" height="70" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="835" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">Dashboard + report</text>
  <text x="835" y="553" text-anchor="middle" fill="currentColor">map layers · briefs · Q&amp;A</text>
  <text x="835" y="569" text-anchor="middle" fill="currentColor">AI text labelled as such</text>

  <line x1="460" y1="551" x2="518" y2="551" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
  <text x="489" y="543" text-anchor="middle" font-size="10" style="fill:var(--muted)">tool calls</text>
  <line x1="710" y1="551" x2="738" y2="551" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahB)"></line>
</svg>
