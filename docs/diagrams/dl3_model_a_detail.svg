<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" style="color:#1a211c;--ground:#ffffff;--surface:#ffffff;--accent:#10695a;--accent-soft:#e3efe9;--muted:#6b7870;--warm:#9a5b12;--warm-soft:#f6ecdd" role="img" aria-label="Detailed architecture of the complete image model: two dates of six-band Landsat surface reflectance at 30 metres are cut into 224 pixel tiles, passed through a convolutional encoder and a UNet decoder to one logit per pixel, trained with focal and Dice loss on eligible pixels, then averaged from 30 metre pixels onto the 100 metre analysis cells and allocated by the cellular automaton.">
  <defs>
    <marker id="ahE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <rect width="1200" height="700" style="fill:var(--ground)"></rect>

  <text x="30" y="34" font-size="13" font-weight="700" fill="currentColor">Model A as implemented &#8212; the complete run</text>
  <text x="30" y="52" style="fill:var(--muted)">src/urbanintel/deep &#183; python scripts/train_image_model.py --source landsat &#183; 501,633 parameters, all trainable</text>

  <!-- INPUT -->
  <text x="30" y="88" font-size="10" letter-spacing="1" style="fill:var(--muted)">INPUT &#183; TWO DATES &#183; SIX LANDSAT BANDS &#183; 30 M</text>
  <rect x="30" y="100" width="186" height="150" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="42" y="118" font-size="10" fill="currentColor">t &#8722; 5</text>
  <rect x="46" y="116" width="186" height="150" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="139" y="140" text-anchor="middle" font-weight="700" fill="currentColor">Landsat, date t</text>
  <text x="58" y="160" fill="currentColor">blue &#183; green &#183; red</text>
  <text x="58" y="176" fill="currentColor">near infrared</text>
  <text x="58" y="192" fill="currentColor">shortwave infrared 1 and 2</text>
  <text x="58" y="214" style="fill:var(--muted)">surface reflectance, scaled</text>
  <text x="58" y="230" style="fill:var(--muted)">integers &#215; 10,000</text>
  <text x="58" y="252" style="fill:var(--muted)">(2, 6, 1127, 1192)</text>

  <text x="120" y="288" text-anchor="middle" style="fill:var(--accent)">Landsat 5 harmonised onto the</text>
  <text x="120" y="303" text-anchor="middle" style="fill:var(--accent)">Landsat 8 scale, Roy et al. (2016)</text>
  <text x="120" y="318" text-anchor="middle" style="fill:var(--muted)">97.1 % valid pixels per epoch</text>

  <line x1="232" y1="180" x2="270" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- TILING -->
  <rect x="272" y="120" width="158" height="120" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="351" y="140" text-anchor="middle" font-weight="700" fill="currentColor">tile + normalise</text>
  <text x="351" y="160" text-anchor="middle" fill="currentColor">224 &#215; 224 px = 6.7 km</text>
  <text x="351" y="176" text-anchor="middle" fill="currentColor">stride 56</text>
  <text x="351" y="192" text-anchor="middle" fill="currentColor">8 flips and rotations</text>
  <text x="351" y="208" text-anchor="middle" fill="currentColor">tiles with growth drawn 4&#215;</text>
  <text x="351" y="230" text-anchor="middle" style="fill:var(--muted)">batch (8, 2, 6, 224, 224)</text>
  <line x1="430" y1="180" x2="468" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- ENCODER -->
  <rect x="470" y="96" width="248" height="180" rx="3" stroke-width="1.5" style="fill:var(--accent-soft);stroke:var(--accent)"></rect>
  <text x="594" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">encoder</text>
  <text x="594" y="132" text-anchor="middle" style="fill:var(--muted)">12 input channels = 2 dates &#215; 6 bands</text>

  <rect x="484" y="142" width="220" height="34" rx="2" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="494" y="157" fill="currentColor">stem: conv 3&#215;3 &#215;2 + BN + ReLU</text>
  <text x="494" y="170" style="fill:var(--muted)">(8, 32, 224, 224)</text>

  <rect x="484" y="182" width="220" height="34" rx="2" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="494" y="197" fill="currentColor">stage 2: stride 2 + dropout 0.1</text>
  <text x="494" y="210" style="fill:var(--muted)">(8, 64, 112, 112)</text>

  <rect x="484" y="222" width="220" height="34" rx="2" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="494" y="237" fill="currentColor">stage 3: stride 2 + dropout 0.1</text>
  <text x="494" y="250" style="fill:var(--muted)">(8, 128, 56, 56)</text>

  <text x="594" y="270" text-anchor="middle" font-size="10" style="fill:var(--warm)">swap for Prithvi-EO-2.0-300M with --encoder prithvi</text>

  <line x1="718" y1="180" x2="756" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- DECODER -->
  <rect x="758" y="110" width="196" height="150" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="856" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">UNet decoder</text>
  <rect x="770" y="142" width="172" height="28" rx="2" stroke="currentColor" style="fill:var(--ground)"></rect>
  <text x="780" y="160" fill="currentColor">1&#215;1 project 128 &#8594; 64</text>
  <rect x="770" y="176" width="172" height="28" rx="2" stroke="currentColor" style="fill:var(--ground)"></rect>
  <text x="780" y="194" fill="currentColor">up &#215;2 + skip 64 &#8594; 64</text>
  <rect x="770" y="210" width="172" height="28" rx="2" stroke="currentColor" style="fill:var(--ground)"></rect>
  <text x="780" y="228" fill="currentColor">up &#215;2 + skip 32 &#8594; 64</text>
  <text x="856" y="252" text-anchor="middle" style="fill:var(--muted)">1&#215;1 head &#8594; (8, 1, 224, 224)</text>

  <path d="M704,160 C732,160 732,190 756,190" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ahE)"></path>
  <path d="M704,200 C724,200 724,224 756,224" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ahE)"></path>
  <text x="718" y="150" font-size="9.5" style="fill:var(--muted)">skip</text>

  <line x1="954" y1="180" x2="992" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- LOSS -->
  <rect x="994" y="118" width="176" height="136" rx="3" stroke-width="1.5" style="fill:var(--warm-soft);stroke:var(--warm)"></rect>
  <text x="1082" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">loss</text>
  <text x="1082" y="156" text-anchor="middle" fill="currentColor">focal(&#945;=0.25, &#947;=2)</text>
  <text x="1082" y="172" text-anchor="middle" fill="currentColor">+ 0.5 &#215; soft Dice</text>
  <text x="1082" y="192" text-anchor="middle" fill="currentColor">masked to pixels whose</text>
  <text x="1082" y="206" text-anchor="middle" fill="currentColor">cell is not urban at t</text>
  <text x="1082" y="226" text-anchor="middle" style="fill:var(--muted)">label painted from the</text>
  <text x="1082" y="240" text-anchor="middle" style="fill:var(--muted)">100 m cell that contains it</text>

  <path d="M1082,254 C1082,296 594,296 594,278" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ahE)"></path>
  <text x="840" y="316" text-anchor="middle" font-size="10" style="fill:var(--muted)">gradients &#183; AdamW, lr 1e-3, cosine decay, gradient clip 5.0, early stopping on average precision</text>

  <!-- ROW 2 -->
  <text x="30" y="368" font-size="10" letter-spacing="1" style="fill:var(--muted)">SPLIT &#183; WHOLE 16 KM BLOCKS ON THE 30 M GRID</text>
  <rect x="30" y="380" width="400" height="140" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="44" y="400" font-weight="700" fill="currentColor">9 blocks &#8594; 1 held out for validation</text>
  <text x="44" y="420" fill="currentColor">186 training tile positions &#183; 36 validation</text>
  <text x="44" y="436" fill="currentColor">120 dropped: they straddle a boundary</text>
  <text x="44" y="456" style="fill:var(--accent)">a block too small to hold a 224 px tile cannot be</text>
  <text x="44" y="470" style="fill:var(--accent)">chosen &#8212; the edge blocks are slivers, and picking</text>
  <text x="44" y="484" style="fill:var(--accent)">one left an earlier run with no validation at all</text>
  <text x="44" y="506" style="fill:var(--muted)">&#215; 2 transitions = 372 training tiles, 230,601 converted pixels</text>

  <line x1="430" y1="450" x2="468" y2="450" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- PREDICT -->
  <rect x="470" y="380" width="248" height="140" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="594" y="400" text-anchor="middle" font-weight="700" fill="currentColor">predict, then come back to 100 m</text>
  <text x="484" y="420" fill="currentColor">sliding window, stride 56</text>
  <text x="484" y="436" fill="currentColor">logits averaged where windows overlap,</text>
  <text x="484" y="450" fill="currentColor">then one sigmoid &#8212; no tile seams</text>
  <text x="484" y="472" fill="currentColor">1,343,384 pixels &#8594; 125,925 cells</text>
  <text x="484" y="488" style="fill:var(--accent)">each pixel joins the cell holding its centre,</text>
  <text x="484" y="502" style="fill:var(--accent)">so nothing is double counted or dropped</text>

  <line x1="718" y1="450" x2="756" y2="450" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- CA -->
  <rect x="758" y="380" width="196" height="140" rx="3" stroke="currentColor" style="fill:var(--surface)"></rect>
  <text x="856" y="400" text-anchor="middle" font-weight="700" fill="currentColor">cellular automaton</text>
  <text x="770" y="420" fill="currentColor">score = 0.65 s + 0.35 n&#8323;&#8320;&#8320;</text>
  <text x="770" y="436" fill="currentColor">8 rounds</text>
  <text x="770" y="452" fill="currentColor">demand 1,214 cells, the count</text>
  <text x="770" y="466" fill="currentColor">really observed</text>
  <text x="770" y="490" style="fill:var(--warm)">the 0.35 is swept, not assumed;</text>
  <text x="770" y="504" style="fill:var(--warm)">0.1 scores better here</text>

  <line x1="954" y1="450" x2="992" y2="450" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahE)"></line>

  <!-- SCORE -->
  <rect x="994" y="380" width="176" height="140" rx="3" stroke-width="1.5" style="fill:var(--accent-soft);stroke:var(--accent)"></rect>
  <text x="1082" y="400" text-anchor="middle" font-weight="700" fill="currentColor">scored once</text>
  <text x="1082" y="418" text-anchor="middle" fill="currentColor">2015 &#8594; 2020, held out</text>
  <text x="1008" y="442" fill="currentColor">AUC          0.8603</text>
  <text x="1008" y="458" fill="currentColor">avg. prec.   0.0761</text>
  <text x="1008" y="474" fill="currentColor">FoM          0.0635</text>
  <text x="1008" y="490" fill="currentColor">hits         145 / 1,214</text>
  <text x="1082" y="510" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">15-epoch run; longer run pending</text>

  <!-- TIMELINE -->
  <text x="30" y="560" font-size="10" letter-spacing="1" style="fill:var(--muted)">TRANSITIONS &#183; INPUT = LANDSAT AT T &#8722; 5 AND T &#183; LABEL = GHSL BUILT-UP CHANGE T &#8594; T + 5</text>
  <rect x="742" y="572" width="132" height="76" fill="currentColor" opacity="0.07"></rect>

  <line x1="80" y1="620" x2="1140" y2="620" stroke="currentColor" stroke-width="1"></line>
  <text x="80" y="640" text-anchor="middle" fill="currentColor">1990</text>
  <text x="212" y="640" text-anchor="middle" fill="currentColor">1995</text>
  <text x="345" y="640" text-anchor="middle" fill="currentColor">2000</text>
  <text x="478" y="640" text-anchor="middle" fill="currentColor">2005</text>
  <text x="610" y="640" text-anchor="middle" fill="currentColor">2010</text>
  <text x="742" y="640" text-anchor="middle" fill="currentColor">2015</text>
  <text x="875" y="640" text-anchor="middle" fill="currentColor">2020</text>
  <text x="1008" y="640" text-anchor="middle" fill="currentColor">2025</text>
  <text x="1140" y="640" text-anchor="middle" fill="currentColor">2030</text>
  <g stroke="currentColor">
    <line x1="80" y1="616" x2="80" y2="624"></line>
    <line x1="212" y1="616" x2="212" y2="624"></line>
    <line x1="345" y1="616" x2="345" y2="624"></line>
    <line x1="478" y1="616" x2="478" y2="624"></line>
    <line x1="610" y1="616" x2="610" y2="624"></line>
    <line x1="742" y1="616" x2="742" y2="624"></line>
    <line x1="875" y1="616" x2="875" y2="624"></line>
    <line x1="1008" y1="616" x2="1008" y2="624"></line>
    <line x1="1140" y1="616" x2="1140" y2="624"></line>
  </g>

  <path d="M216,602 v6 H341 v-6" fill="none" stroke="currentColor"></path>
  <text x="278" y="596" text-anchor="middle" fill="currentColor">train</text>
  <path d="M614,602 v6 H738 v-6" fill="none" stroke="currentColor"></path>
  <text x="676" y="596" text-anchor="middle" fill="currentColor">train</text>
  <path d="M746,602 v6 H871 v-6" fill="none" stroke-width="1.5" style="stroke:var(--accent)"></path>
  <text x="808" y="596" text-anchor="middle" font-weight="700" style="fill:var(--accent)">TEST, touched once</text>
  <path d="M349,602 v6 H474 v-6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"></path>
  <path d="M482,602 v6 H606 v-6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"></path>
  <text x="478" y="596" text-anchor="middle" style="fill:var(--muted)">available once GHSL 2005 downloads</text>

  <text x="30" y="666" style="fill:var(--muted)">Landsat</text>
  <text x="80" y="666" text-anchor="middle" fill="currentColor">L5</text>
  <text x="212" y="666" text-anchor="middle" fill="currentColor">L5</text>
  <text x="345" y="666" text-anchor="middle" fill="currentColor">L5</text>
  <text x="478" y="666" text-anchor="middle" fill="currentColor">L5</text>
  <text x="610" y="666" text-anchor="middle" fill="currentColor">L5</text>
  <text x="742" y="666" text-anchor="middle" fill="currentColor">L8</text>
  <text x="30" y="686" style="fill:var(--muted)">GHSL</text>
  <circle cx="212" cy="682" r="4" fill="currentColor"></circle>
  <circle cx="345" cy="682" r="4" fill="currentColor"></circle>
  <circle cx="478" cy="682" r="4" fill="none" stroke="currentColor" stroke-dasharray="2 2"></circle>
  <circle cx="610" cy="682" r="4" fill="currentColor"></circle>
  <circle cx="742" cy="682" r="4" fill="currentColor"></circle>
  <circle cx="875" cy="682" r="4" fill="currentColor"></circle>
  <text x="900" y="686" font-size="10" style="fill:var(--muted)">&#9679; label on disk    &#9675; not yet downloaded</text>
</svg>
