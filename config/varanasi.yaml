# =============================================================================
# Varanasi — Study Area Configuration
# Satellite-Based Urban Growth and Economic Activity Intelligence System
# =============================================================================

city:
  name: Varanasi
  state: Uttar Pradesh
  country: India
  country_iso3: IND
  # Kashi Vishwanath / city centre reference point
  centre:
    lat: 25.3176
    lon: 82.9739

aoi:
  # Analysis envelope: Varanasi Municipal Corporation + Ring Road corridor +
  # peri-urban growth belt + Babatpur airport corridor to the NW.
  # ~35 km (E-W) x 33 km (N-S)
  bbox:
    min_lon: 82.80
    min_lat: 25.15
    max_lon: 83.15
    max_lat: 25.45

crs:
  geographic: "EPSG:4326"      # storage / web maps
  projected: "EPSG:32644"      # UTM zone 44N — metric analysis for Varanasi
  mollweide: "ESRI:54009"      # GHSL native grid

grid:
  # Analysis grid for zonal statistics and the ghost-growth classifier.
  cell_size_m: 500
  # Ignore near-empty cells when computing activity ratios. Expressed as a
  # FRACTION of cell area, not absolute m^2 — the same absolute threshold
  # means 2% of a 500 m cell but 50% of a 100 m cell, and analysis runs on
  # the 100 m frame.
  min_builtup_fraction_for_analysis: 0.02

# -----------------------------------------------------------------------------
# Analysis epochs.
# Aligned with the GHSL 5-year epochs so built-up change is directly
# comparable, and with the VIIRS era (2012+) for the economic-activity signal.
#
# "current" is 2020 because it is the LAST OBSERVED GHSL epoch. GHS-BUILT-S
# R2023A also publishes 2025 and 2030, but those are the GHSL model's own
# projections. Until Review 3 this key was 2025, so every "2010-2025" figure
# was measured against a forecast. The projection is now kept only as a
# labelled comparison (sources.ghsl.projected_epochs).
# -----------------------------------------------------------------------------
epochs:
  baseline: 2010
  mid: 2015
  current: 2020

# Full annual series where the sensor supports it
timeseries:
  nightlights_start: 2013     # VIIRS annual V2 stable coverage
  nightlights_end: 2024
  # Activity LEVEL for the ghost-growth screen = mean of the last N years
  # (2022-2024). Development is observed to 2020 and activity 2022-2024, so
  # new building has had at least two years to be occupied. A 3-year mean is
  # also steadier than any single annual composite.
  nightlights_level_years: 3
  # Last year of the version-clean V2.1 record. The hold-out test classifies
  # with 2013-2020 only and checks the classes against 2021-2024.
  nightlights_holdout_split: 2020
  # Sentinel-2 L2A coverage over Varanasi is too sparse before 2018 to build a
  # seasonal median: the Oct-Mar 2015 window holds 3 scenes from a single day
  # against ~148 scenes on ~35 days from 2019 on. Differencing a one-day
  # composite against a full-season one measures sampling, not vegetation.
  vegetation_start: 2018      # Sentinel-2 (first year with >30 acquisition days)
  vegetation_end: 2025
  thermal_start: 2013         # Landsat 8 onward
  thermal_end: 2025

# -----------------------------------------------------------------------------
# Thresholds — all documented, all tunable. See docs/METHODOLOGY.md.
# -----------------------------------------------------------------------------
thresholds:
  builtup:
    # GHS-BUILT-S is m^2 of built surface per 100m cell (max 10000).
    # 20% surface fraction is the GHSL-conventional "urban fabric" cut.
    surface_fraction_urban: 0.20
    # A cell is "new built-up" if it crosses the cut between two epochs
    new_growth_min_delta_m2: 1000

  nightlights:
    # VIIRS annual radiance, nW/cm2/sr. Below this is effectively unlit.
    unlit_radiance: 0.5
    # Bright commercial/industrial core
    high_activity_radiance: 15.0

  vegetation:
    ndvi_green_threshold: 0.30      # NDVI above this = vegetated
    green_loss_min_delta: -0.10     # NDVI drop counting as green cover loss
    # Built-up gain over the SAME years as the NDVI change, from Dynamic World.
    # Its annual-mean built probability tops out near 0.5 even in the old city
    # (median 0.47-0.49 in cells GHSL puts above 20% built), so "became built"
    # = probability rose by >= 0.15 (top ~3% of rises) and ended >= 0.30.
    dw_built_min_rise: 0.15
    dw_built_min_end: 0.30

  thermal:
    # Surface Urban Heat Island intensity: LST minus the median LST of the
    # rural reference cells, in degrees C. Hotspot = this or hotter.
    suhi_hotspot_delta_c: 3.0
    # Rural reference = under 2% GHSL built surface, AND Dynamic World 2024
    # built probability below rural_max_dw_built (catches land built after
    # 2020), AND not water (Dynamic World water probability >= water_probability).
    rural_max_dw_built: 0.20
    water_probability: 0.50

  ghost_growth:
    # A cell is a candidate "ghost growth" / underutilised zone when it has
    # substantial NEW built-up but the activity signal stays low.
    # See analysis/ghost.py for the full composite index.
    #
    # "New" is defined RELATIVELY — what share of the cell's *current*
    # built-up appeared since the baseline. An absolute cut cannot work:
    # 0.15 sits at the 99th percentile of observed GHSL change in Varanasi,
    # while a cell that went 0.50 -> 0.56 is mostly old development and a
    # cell that went 0.00 -> 0.25 is entirely new. Share captures that;
    # absolute delta does not.
    min_new_share: 0.50              # >=50% of current built-up is post-baseline
    min_new_builtup_fraction: 0.02   # ...and at least 2% of the cell, absolutely
    max_activity_percentile: 25      # activity in bottom quartile of built cells

    # What counts as "activity rising" when separating emerging (filling up)
    # from ghost growth. See analysis/ghost.py:rising_masks.
    #   raw                   slope > 0 (Review 2 rule; nearly every cell passes,
    #                         because the whole city brightened)
    #   significant           slope > 0 and p <= trend_alpha
    #   relative              brightening faster than the established city
    #   relative_significant  faster than the city, and significantly so
    trend_rule: relative_significant
    trend_alpha: 0.10

    # Zones are defined by local DENSITY of flagged cells, not by contiguity —
    # flagged cells at 100 m are genuinely fragmented, so contiguity-based
    # grouping returns nothing and that would be a method artefact, not a
    # finding. See analysis/ghost.py:cluster_zones.
    zone_neighbourhood_m: 600
    zone_density_ratio: 2.0          # flagged at >=2x the citywide background rate
    zone_min_area_km2: 0.25

# -----------------------------------------------------------------------------
# Data sources.
# `auth: none` sources are downloaded directly by the pipeline and work
# out of the box. `auth: gee` sources require the user to run
# `earthengine authenticate` once — see scripts/gee_export.py.
# -----------------------------------------------------------------------------
sources:
  ghsl:
    auth: none
    base_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL"
    release: R2023A
    resolution_m: 100
    products:
      built_surface: GHS_BUILT_S
      population: GHS_POP
      settlement_model: GHS_SMOD
    # Only 1975-2020 are observed. 2025 and 2030 are the GHSL model's own
    # projections: loaded for a labelled comparison, never as a measurement.
    epochs: [2010, 2015, 2020]
    projected_epochs: [2025]

  worldpop:
    auth: none
    base_url: "https://data.worldpop.org/GIS/Population"
    year: 2020
    variant: Global_2000_2020_Constrained

  osm:
    auth: none
    overpass_endpoints:
      - "https://overpass-api.de/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://overpass.osm.jp/api/interpreter"
    user_agent: "urbanintel-varanasi/0.1 (academic urban growth research)"
    timeout_s: 180

  gee:
    auth: gee
    # Google Cloud project registered for Earth Engine. Not a secret (it is an
    # identifier, not a credential), but it is account-specific — change it if
    # you run this under a different Earth Engine registration.
    project: satellite-505815
    assets:
      # VNL annual series is split across two product versions in the EE
      # catalogue: V2.1 holds 2013-2021, V2.2 holds 2022 onward. Neither
      # covers the whole range, so both are needed. See gee.nightlights_image.
      viirs_annual: "NOAA/VIIRS/DNB/ANNUAL_V22"
      viirs_annual_legacy: "NOAA/VIIRS/DNB/ANNUAL_V21"
      viirs_annual_legacy_last_year: 2021
      viirs_monthly: "NOAA/VIIRS/DNB/MONTHLY_V1/VCMSLCFG"
      dmsp: "NOAA/DMSP-OLS/NIGHTTIME_LIGHTS"
      s2_sr: "COPERNICUS/S2_SR_HARMONIZED"
      landsat8: "LANDSAT/LC08/C02/T1_L2"
      landsat9: "LANDSAT/LC09/C02/T1_L2"
      landsat5: "LANDSAT/LT05/C02/T1_L2"
      modis_lst: "MODIS/061/MOD11A2"
      dynamic_world: "GOOGLE/DYNAMICWORLD/V1"
      open_buildings_temporal: "GOOGLE/Research/open-buildings-temporal/v1"
      esa_worldcover: "ESA/WorldCover/v200"
      srtm: "USGS/SRTMGL1_003"
      worldpop_gp: "WorldPop/GP/100m/pop"
    export_scale_m: 30
    max_cloud_pct: 35
    # Minimum distinct acquisition dates required to accept a median composite.
    # Guards against comparing a single-date composite with a seasonal one.
    min_composite_dates: 20
    # Landsat 8 + 9 together revisit every 8 days, so a March-May window holds
    # ~11 distinct dates at best (2024) and 5 with Landsat 8 alone (2013).
    min_composite_dates_landsat: 4

# -----------------------------------------------------------------------------
# Growth model (scripts/run_growth_model.py). Observational epochs only.
# -----------------------------------------------------------------------------
growth_model:
  train: [2010, 2015]
  test: [2015, 2020]
  projection_years: [2025, 2030]     # +5 and +10 years from the last observed epoch
  random_forest:
    n_estimators: 300
    min_samples_leaf: 20

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  outputs: outputs
